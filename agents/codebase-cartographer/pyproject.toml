# Runs on Gemini. Get a free key at https://aistudio.google.com/apikey and set
# GEMINI_API_KEY. Override the model with GEMINI_MODEL (default: gemini-2.5-flash).
[project]
name = "codebase-cartographer"
version = "0.2.0"
description = "HTTP agent that crawls a repository and writes the full codebase map"
requires-python = ">=3.11"
dependencies = [
    "agent-runtime @ git+https://github.com/pronoy1004/agent-runtime",
]
